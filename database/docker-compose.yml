version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uni_portfolio_db
    environment:
      POSTGRES_USER: portfolio_admin
      POSTGRES_PASSWORD: local_secret_pass
      POSTGRES_DB: university_portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Автоматически выполним SQL скрипт при первом запуске
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_admin -d university_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network

  minio:
    image: minio/minio:latest
    container_name: uni_portfolio_s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # API порт (это эндпоинт для твоего Go-клиента)
      - "9001:9001"  # Веб-консоль MinIO (можно смотреть файлы через браузер)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - portfolio_network

  # Должен создать бакет автоматически, но если не видишь бакета в сервисе, то ручками создай его с названием uni-portfolio-bucket
  minio-init:
    image: minio/mc:latest
    container_name: minio_bucket_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add localminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb localminio/uni-portfolio-bucket;
      /usr/bin/mc anonymous set private localminio/uni-portfolio-bucket;
      echo 'Bucket uni-portfolio-bucket created successfully';
      exit 0;
      "
    networks:
      - portfolio_network

volumes:
  postgres_data:
  minio_data:

networks:
  portfolio_network:
    driver: bridge